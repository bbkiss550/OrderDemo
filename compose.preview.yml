# Local Mobile Web Studio preview only. The default compose keeps frame blocking.
# Enable: docker compose -f compose.yml -f compose.preview.yml up -d --build app
# Disable: docker compose -f compose.yml up -d app
services:
  app:
    ports: !override
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mobile-preview
