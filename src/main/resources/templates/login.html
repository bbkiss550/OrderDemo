<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ • FoodFlow</title><link rel="stylesheet" href="/assets/vendor/css/core.css"><link rel="stylesheet" href="/assets/vendor/css/theme-default.css"><link rel="stylesheet" href="/css/admin.css"></head>
<body class="login-page"><div class="login-art"><div class="brand-icon">♨</div><h1>FoodFlow</h1><p>ทุกโต๊ะ ทุกออเดอร์<br>จัดการได้ในที่เดียว</p><div class="food-icons">🥩 🍲 🦐 🥬</div><small>Quick Ordering for Shabu & Grill</small></div><main class="login-form"><a class="brand" href="/login"><span class="brand-icon">♨</span> FoodFlow</a><h2>ยินดีต้อนรับ 👋</h2><p>เข้าสู่ระบบเพื่อดูแลร้านและรับลูกค้า</p><div th:if="${failed}" class="alert alert-danger">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div><form th:action="@{/login}" method="post"><label class="form-label" for="username">ชื่อผู้ใช้</label><input class="form-control mb-3" id="username" name="username" required autocomplete="username" autofocus><label class="form-label" for="password">รหัสผ่าน</label><input class="form-control mb-4" id="password" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary w-100">เข้าสู่ระบบ</button></form></main></body></html>
