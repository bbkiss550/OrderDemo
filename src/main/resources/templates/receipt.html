<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="'ใบเปิดบิล #'+${bill.id}"></title>
<style th:inline="css">
@page { size: auto; margin: 0; }
*{box-sizing:border-box}body{margin:0;background:#f3f3f6;font-family:Tahoma,sans-serif;color:#000}.controls{text-align:center;padding:20px;font-size:13px}.controls button{background:#6965ff;color:#fff;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}.receipt{width:[[${shop.paper_width}]]mm;padding:[[${shop.paper_margin}]]mm;background:#fff;margin:0 auto 30px;font-size:12px;overflow-wrap:anywhere}.center{text-align:center}h1{font-size:17px;margin:7px 0}h2{font-size:15px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.dash{border-top:1px dashed #222;margin:12px 0}.qr{width:45mm;max-width:100%;height:auto}.small{font-size:10px;line-height:1.6}.total{font-size:16px;font-weight:bold}.label{max-width:70%}@media print{body{background:#fff}.controls{display:none}.receipt{margin:0}a{color:#000}}
</style></head><body>
<div class="controls"><button id="printReceipt">พิมพ์เอกสาร</button><p>เลือกขนาดกระดาษในเครื่องพิมพ์ให้ตรงกับค่าร้าน และปิดหัวกระดาษ/ท้ายกระดาษของเบราว์เซอร์</p></div>
<article class="receipt"><div class="center"><h1 th:text="${bill.shop_name}"></h1><h2 th:text="${bill.status == 'PAID' ? 'ใบเสร็จรับเงิน' : 'ใบเปิดบิล'}"></h2><p th:text="'เลขที่ #'+${bill.id}"></p><h2 th:text="'โต๊ะ '+${bill.table_name}"></h2></div>
<div class="dash"></div><div class="row"><span>ระยะเวลาใช้บริการ</span><strong th:text="${bill.duration_minutes}+' นาที'"></strong></div><div class="row"><span>เริ่มบริการ</span><span th:text="${bill.opened_text}"></span></div><div class="row"><span>สิ้นสุดบริการ</span><span th:text="${bill.ends_text}"></span></div><div class="dash"></div>
<div class="row" th:if="${bill.package_name != null}"><span>แพ็กเกจ</span><strong th:text="${bill.package_name}"></strong></div>
<div th:each="line:${bill.lines}"><div class="row"><span class="label" th:text="${line.package_name} + (${line.package_id != null} ? (${line.audience == 'ADULT'} ? ' · ผู้ใหญ่' : ' · เด็ก') : '') + ' × ' + ${line.quantity}"></span><span th:text="${#numbers.formatDecimal(line.price * line.quantity,1,'COMMA',2,'POINT')}"></span></div><div class="small" th:text="'ราคา '+${#numbers.formatDecimal(line.price,1,'COMMA',2,'POINT')}+' บาท / คน'"></div></div>
<div class="dash"></div><div class="row"><span>มูลค่าก่อน VAT</span><span th:text="${#numbers.formatDecimal(bill.subtotal,1,'COMMA',2,'POINT')}"></span></div><div class="row"><span th:text="'VAT '+${bill.vat_rate}+'%'"></span><span th:text="${#numbers.formatDecimal(bill.vat,1,'COMMA',2,'POINT')}"></span></div><div class="row" th:if="${bill.penalty_applied}"><span>ค่าปรับ</span><span th:text="${#numbers.formatDecimal(bill.penalty_rate,1,'COMMA',2,'POINT')}"></span></div><div class="row total"><span th:text="${bill.status == 'PAID' ? 'ชำระแล้ว' : 'ค่าบริการรวม'}"></span><span th:text="${#numbers.formatDecimal(bill.status == 'PAID' ? bill.paid_total : bill.total,1,'COMMA',2,'POINT')}+' บาท'"></span></div>
<div class="dash"></div><div class="center" th:if="${bill.status == 'OPEN'}"><img class="qr" th:src="@{/admin/bills/{id}/qr(id=${bill.id})}" alt="QR สำหรับสั่งอาหาร"><h2>สแกนเพื่อสั่งอาหาร</h2><p class="small">ใช้ได้เฉพาะบิลนี้ เมื่อหมดเวลาสั่งอาหารเพิ่มไม่ได้<br>ชำระเงินเมื่อทานเสร็จ</p></div><div class="center" th:if="${bill.status == 'PAID'}"><h2>ขอบคุณที่ใช้บริการ</h2><p>บิลนี้ชำระเงินแล้ว</p></div></article><script src="/js/receipt.js"></script></body></html>
