<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
<meta name="referrer" content="same-origin">
<title th:text="${bill.shop_name}+' • สั่งอาหาร'">สั่งอาหาร</title>
<link rel="stylesheet" href="/css/customer.css"></head>
<body th:attr="data-token=${bill.qr_token}">
<div class="quick-order">
 <header class="customer-header"><div class="customer-brand"><span class="customer-logo">♨</span><div><strong id="customerShop" th:text="${bill.shop_name}"></strong><small id="customerPackage" th:text="${bill.package_name}"></small></div></div><strong class="table-label" id="customerTable" th:text="'โต๊ะ '+${bill.table_name}"></strong></header>
 <div class="service-time"><span id="customerTime">กำลังตรวจเวลา…</span><button type="button" data-customer-view="info">ข้อมูลโต๊ะ</button></div>
 <div id="customerNotice" role="status" hidden></div>
 <main id="customerView"><div class="customer-empty">กำลังโหลดเมนูอาหาร…</div></main>
 <div id="customerCartBar"></div>
 <nav class="customer-nav" aria-label="เมนูลูกค้า"><button type="button" data-customer-view="menu">🍲<span>เมนูอาหาร</span></button><button type="button" data-customer-view="orders">🧾<span>ออเดอร์</span></button><button type="button" data-customer-view="info">◷<span>ข้อมูลโต๊ะ</span></button></nav>
</div>
<noscript>กรุณาเปิด JavaScript เพื่อเลือกและส่งออเดอร์อาหาร</noscript>
<script src="/js/customer.js"></script>
</body></html>
