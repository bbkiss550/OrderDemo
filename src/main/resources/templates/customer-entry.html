<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodFlow • ข้อมูลบริการ</title><link rel="stylesheet" href="/assets/vendor/css/core.css"><link rel="stylesheet" href="/assets/vendor/css/theme-default.css"><link rel="stylesheet" href="/css/admin.css"></head><body><main class="customer-shell"><div class="brand"><span class="brand-icon">♨</span><span th:text="${bill.shop_name}"></span></div><article class="card"><span class="pill purple align-self-start" th:text="'โต๊ะ '+${bill.table_name}"></span><h1 class="mt-4" th:text="${bill.status == 'PAID' ? 'บิลนี้สิ้นสุดแล้ว' : (bill.expired ? 'หมดเวลาสั่งอาหารแล้ว' : 'ยินดีต้อนรับ')} "></h1><p th:if="${bill.status == 'PAID'}">ชำระเงินเรียบร้อย QR นี้ใช้สั่งอาหารต่อไม่ได้</p><p th:if="${bill.status == 'OPEN' and bill.expired}">ท่านยังทานต่อได้ แต่ไม่สามารถสั่งอาหารเพิ่ม กรุณาติดต่อพนักงานเมื่อต้องการเช็คบิล</p><div th:if="${bill.status == 'OPEN'}"><div class="quote"><p class="mb-1">เวลาใช้บริการ</p><div class="clock-value" th:text="${bill.duration_minutes}+' นาที'"></div><div class="mt-3"><small class="muted">เริ่มบริการ</small><div th:text="${bill.opened_text}"></div></div><div class="mt-3"><small class="muted">สิ้นสุดบริการ</small><div th:text="${bill.ends_text}"></div></div></div><p class="mt-4 mb-0" th:unless="${bill.expired}">ระบบสั่งอาหารอยู่ระหว่างเตรียมเปิดใช้งาน กรุณาสั่งกับพนักงาน</p></div></article><p class="small text-center mt-3" th:text="'บิล #'+${bill.id}"></p></main></body></html>
