spring.application.name=food-order-demo
spring.config.import=optional:file:./config/application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_order_demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=${SERVER_PORT:8080}
spring.jackson.time-zone=Asia/Bangkok
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=30m

